[package]
name = "pgdf"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
polars = "0.48.1"
tokio = { version = "1.45.1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
postgres-types = { version = "0.2", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
